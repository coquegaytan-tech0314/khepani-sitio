  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Instituto Khépani · Editorial (restaurando)</title>
  <script>
  // Temporary loader: branch file was accidentally replaced with a placeholder.
  // CloudAgent will replace this with the patched full HTML.
  fetch('https://raw.githubusercontent.com/coquegaytan-tech0314/khepani-sitio/main/propuestas/editorial/index.html')
    .then(function (r) { return r.text(); })
    .then(function (html) {

      document.write(html);

    .catch(function (e) {

    });
  </script>

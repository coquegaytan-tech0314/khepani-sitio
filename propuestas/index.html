<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cuatro propuestas — Instituto Khépani</title>
  <meta name="description" content="Cuatro borradores de diseño para Instituto Khépani en Uriangato, Guanajuato. Sellos, Editorial, Academia y Presidencial. No es el sitio en vivo.">
  <meta name="robots" content="noindex">
  <style>
    :root {
      --cream: #fffaf5;
      --cream-2: #fef4ea;
      --naranja: #ea6a1a;
      --naranja-dark: #d15810;
      --navy: #0b2a52;
      --ink: #14243d;
      --muted: #5a6274;
      --border: #ecd6c0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; height: 100dvh; }
    body {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      background: var(--cream);
      color: var(--ink);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding-top: env(safe-area-inset-top);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .chrome {
      flex: none;
      min-height: 58px;
      display: flex;
      align-items: center;
      gap: 10px 12px;
      padding: 6px 14px;
      background: linear-gradient(180deg, #fffefb, var(--cream-2));
      border-bottom: 1px solid var(--border);
      box-shadow: 0 1px 0 rgba(234,106,26,.08);
    }
    .brand {
      display: flex;
      flex-direction: column;
      justify-content: center;
      line-height: 1.15;
      min-width: 0;
      min-height: 44px;
      flex: 0 1 auto;
    }
    .brand b {
      font-size: 13px;
      color: var(--navy);
      letter-spacing: .01em;
      white-space: nowrap;
    }
    .brand span {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
    }
    .tabs {
      display: flex;
      gap: 6px;
      margin-left: auto;
      flex: 1 1 auto;
      justify-content: flex-end;
      flex-wrap: nowrap;
      min-width: 0;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scroll-snap-type: x proximity;
      scrollbar-width: none;
      padding-bottom: 1px;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      appearance: none;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--navy);
      font-weight: 650;
      font-size: 14px;
      min-height: 44px;
      padding: 0 14px;
      border-radius: 999px;
      cursor: pointer;
      font-family: inherit;
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      scroll-snap-align: start;
      touch-action: manipulation;
    }
    .tab[aria-selected="true"] {
      background: var(--naranja);
      border-color: var(--naranja);
      color: var(--navy);
    }
    .tab:focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; }
    .note {
      display: none;
      font-size: 11px;
      color: var(--muted);
      padding-left: 8px;
      border-left: 1px solid var(--border);
      max-width: 280px;
    }
    @media (max-width: 759px) {
      .chrome { flex-wrap: wrap; align-items: stretch; padding: 8px 12px 10px; gap: 6px; }
      .brand { flex: 1 1 100%; min-height: 28px; }
      .brand span { display: none; }
      .tabs { flex: 1 1 100%; margin-left: 0; justify-content: flex-start; }
      .tab { font-size: 14px; }
    }
    @media (min-width: 1100px) {
      .note { display: block; }
    }
    .frames { flex: 1; min-height: 0; position: relative; background: #fff; }
    iframe {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      border: 0; background: #fff;
    }
    iframe[hidden] { display: none; }
  </style>
</head>
<body>
  <div class="chrome">
    <div class="brand">
      <b>Instituto Khépani</b>
      <span>Uriangato · cuatro borradores</span>
    </div>
    <div class="tabs" role="tablist" aria-label="Propuestas de diseño">
      <button class="tab" role="tab" id="tab-sellos" aria-controls="view-sellos" aria-selected="true" data-tab="sellos">Sellos</button>
      <button class="tab" role="tab" id="tab-editorial" aria-controls="view-editorial" aria-selected="false" data-tab="editorial">Editorial</button>
      <button class="tab" role="tab" id="tab-academia" aria-controls="view-academia" aria-selected="false" data-tab="academia">Academia</button>
      <button class="tab" role="tab" id="tab-presidencial" aria-controls="view-presidencial" aria-selected="false" data-tab="presidencial">Presidencial</button>
    </div>
    <p class="note">Borradores de diseño — no son el sitio en vivo institutokhepani.com</p>
  </div>
  <div class="frames">
    <iframe id="view-sellos" title="Propuesta Sellos" src="sellos/" allow="clipboard-write"></iframe>
    <iframe id="view-editorial" title="Propuesta Editorial" src="editorial/" hidden allow="clipboard-write"></iframe>
    <iframe id="view-academia" title="Propuesta Academia" src="academia/" hidden allow="clipboard-write"></iframe>
    <iframe id="view-presidencial" title="Propuesta Presidencial" src="presidencial/" hidden allow="clipboard-write"></iframe>
  </div>
  <script>
    (function () {
      var names = ["sellos", "editorial", "academia", "presidencial"];
      function show(name) {
        if (names.indexOf(name) === -1) name = "sellos";
        names.forEach(function (n) {
          var tab = document.getElementById("tab-" + n);
          var view = document.getElementById("view-" + n);
          var on = n === name;
          tab.setAttribute("aria-selected", on ? "true" : "false");
          if (on) view.removeAttribute("hidden");
          else view.setAttribute("hidden", "");
        });
        if (location.hash.slice(1) !== name) {
          history.replaceState(null, "", "#" + name);
        }
        var active = document.getElementById("tab-" + name);
        if (active && active.scrollIntoView) {
          active.scrollIntoView({ inline: "nearest", block: "nearest" });
        }
      }
      document.querySelectorAll("[data-tab]").forEach(function (btn) {
        btn.addEventListener("click", function () { show(btn.getAttribute("data-tab")); });
      });
      window.addEventListener("hashchange", function () {
        show(location.hash.replace("#", "") || "sellos");
      });
      show(location.hash.replace("#", "") || "sellos");
    })();
  </script>
</body>
</html>
